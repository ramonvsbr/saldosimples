name = "saldosimples"
main = "index.js"
compatibility_date = "2026-08-28"

[assets]
directory = "../"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "saldosimples-db"
database_id = "<COLOQUE_SEU_DATABASE_ID_AQUI>"

# TROQUE pelo domínio real de produção (ex: "https://saldosimples.com").
# Como o worker também serve o frontend (ver [assets] acima), isso não afeta
# o uso normal do app; só impede que outros sites façam requisições à API
# e leiam a resposta.
[vars]
ALLOWED_ORIGIN = "<COLOQUE_SEU_DOMINIO_AQUI>"

# Limpeza diária da tabela auth_attempts (ver função scheduled() no index.js).
# Roda todo dia às 03:00 UTC.
[triggers]
crons = ["0 3 * * *"]